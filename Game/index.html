<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>⚡ Dark Runner · shifting worlds</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background:#07080c; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0.6rem;
    font-family:'Segoe UI', system-ui, sans-serif; touch-action:manipulation; overflow:hidden;
    color:#c8d0e0; padding:0.5rem;
  }
  canvas {
    display:block; width:min(1000px, 98vw); height:auto; aspect-ratio:1000/400;
    border-radius:1.2rem; background:#0a0c12; touch-action:none; cursor:pointer;
  }
  .hud {
    display:flex; justify-content:space-between; align-items:center;
    width:min(1000px, 98vw); padding:0 0.4rem;
    font-weight:600; letter-spacing:2px; text-transform:uppercase;
    font-size:clamp(0.8rem, 2.5vw, 1.1rem);
  }
  .score-container, .best-container {
    background:#12151f; padding:0.35rem 1rem; border-radius:40px; border:1px solid #2a3040;
  }
  .best-container { color:#e0b060; border-color:#4a3a20; }
  .hint {
    color:#4a5468; font-size:clamp(0.6rem, 1.8vw, 0.78rem); letter-spacing:2px;
    text-align:center; opacity:0.85;
  }
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1rem;
    background:rgba(7,8,12,0.94); z-index:10;
    transition:opacity 0.25s; padding:1rem;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay h1 {
    font-size:clamp(1.4rem, 4vw, 2rem); letter-spacing:4px; font-weight:800;
    color:#e8eeff; text-transform:uppercase;
  }
  .overlay h1 span { color:#7a9ac0; }
  .overlay .subtext {
    color:#8090a8; font-size:clamp(0.75rem, 2vw, 0.9rem); letter-spacing:2px;
    text-align:center; max-width:500px; line-height:1.6;
  }
  .overlay .restart-btn {
    background:#1a1f2e; border:1px solid #3f4a60; color:#e0e8f8;
    padding:0.8rem 2rem; border-radius:2rem; font-weight:700; letter-spacing:3px;
    font-size:clamp(0.85rem, 2vw, 1rem); cursor:pointer; text-transform:uppercase;
    font-family:inherit; transition:background 0.15s;
  }
  .overlay .restart-btn:hover { background:#242b3c; }
  .overlay .restart-btn:active { transform:scale(0.97); }
</style>
</head>
<body>
<canvas id="gameCanvas" width="1000" height="400"></canvas>
<div class="hud">
  <div class="score-container">SCORE <span id="scoreDisplay">0</span></div>
  <div class="best-container">BEST <span id="bestDisplay">0</span></div>
</div>
<div class="hint">[ TAP / CLICK / SPACE ] JUMP · DOUBLE JUMP</div>

<div class="overlay" id="startOverlay">
  <h1>DARK <span>RUNNER</span></h1>
  <p class="subtext">Starts easy. Gets harder after score 1000.<br>The world shifts as you climb.<br>Tap, click, or press Space to begin.</p>
  <button class="restart-btn" id="startBtn">Start</button>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <h1>GAME <span>OVER</span></h1>
  <p class="subtext" id="gameOverSub">Score: 0 · Best: 0</p>
  <button class="restart-btn" id="retryBtn">Retry</button>
</div>

<script>
(function(){
  // ============================================================
  //  CANVAS
  // ============================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');
  const bestSpan = document.getElementById('bestDisplay');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const gameOverSub = document.getElementById('gameOverSub');

  const W = 1000, H = 400;
  const GROUND_Y = 340;
  const PLAYER_SIZE = 38;
  const PLAYER_X = 140;

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  function applyDPR() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
  }
  applyDPR();
  window.addEventListener('resize', applyDPR);

  // ============================================================
  //  DIFFICULTY RAMP
  // ============================================================
  const RAMP = {
    easyUntil: 1000,
    hardAt:    3000,

    startSpeed:    4.0,
    startGravity:  0.52,
    startMinSpawn: 60,
    startMaxSpawn: 90,
    startObMinW:   16,
    startObMaxW:   28,
    startObMinH:   16,
    startObMaxH:   30,

    endSpeed:      13.5,
    endGravity:    0.82,
    endMinSpawn:   18,
    endMaxSpawn:   30,
    endObMinW:     30,
    endObMaxW:     55,
    endObMinH:     34,
    endObMaxH:     70
  };

  function rampT(score) {
    if (score <= RAMP.easyUntil) return 0;
    if (score >= RAMP.hardAt) return 1;
    return (score - RAMP.easyUntil) / (RAMP.hardAt - RAMP.easyUntil);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function difficulty(score) {
    const t = rampT(score);
    return {
      t,
      speed:     lerp(RAMP.startSpeed, RAMP.endSpeed, t),
      gravity:   lerp(RAMP.startGravity, RAMP.endGravity, t),
      minSpawn:  lerp(RAMP.startMinSpawn, RAMP.endMinSpawn, t),
      maxSpawn:  lerp(RAMP.startMaxSpawn, RAMP.endMaxSpawn, t),
      obMinW:    lerp(RAMP.startObMinW, RAMP.endObMinW, t),
      obMaxW:    lerp(RAMP.startObMaxW, RAMP.endObMaxW, t),
      obMinH:    lerp(RAMP.startObMinH, RAMP.endObMinH, t),
      obMaxH:    lerp(RAMP.startObMaxH, RAMP.endObMaxH, t)
    };
  }

  // ============================================================
  //  BACKGROUND THEMES
  // ============================================================
  const THEMES = [
    {
      name: 'EASY',
      skyTop:    [14, 22, 38],
      skyBottom: [28, 44, 70],
      ground:    [70, 90, 120],
      horizon:   [60, 110, 160]
    },
    {
      name: 'NORMAL',
      skyTop:    [26, 16, 44],
      skyBottom: [58, 32, 82],
      ground:    [90, 70, 120],
      horizon:   [140, 90, 180]
    },
    {
      name: 'HARD',
      skyTop:    [44, 14, 20],
      skyBottom: [92, 28, 34],
      ground:    [130, 60, 66],
      horizon:   [200, 80, 70]
    },
    {
      name: 'VERY HARD',
      skyTop:    [50, 8, 8],
      skyBottom: [120, 30, 10],
      ground:    [170, 70, 30],
      horizon:   [255, 140, 40]
    }
  ];

  function themeBlend(t) {
    const seg = t * (THEMES.length - 1);
    const i = Math.min(THEMES.length - 2, Math.floor(seg));
    const f = seg - i;
    const a = THEMES[i], b = THEMES[i + 1];
    function mix(key) {
      return [
        lerp(a[key][0], b[key][0], f),
        lerp(a[key][1], b[key][1], f),
        lerp(a[key][2], b[key][2], f)
      ];
    }
    return {
      skyTop:  mix('skyTop'),
      skyBottom: mix('skyBottom'),
      ground:  mix('ground'),
      horizon: mix('horizon')
    };
  }

  function rgb(arr, alpha) {
    const r = Math.round(arr[0]), g = Math.round(arr[1]), b = Math.round(arr[2]);
    return alpha === undefined ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha})`;
  }

  // ============================================================
  //  GAME STATE
  // ============================================================
  let gameState = 'menu';
  let player = { y:0, vy:0, width:PLAYER_SIZE, height:PLAYER_SIZE, grounded:true, jumpsUsed:0, maxJumps:2 };
  let obstacles = [];
  let particles = [];
  let score = 0;
  let bestScore = 0;
  let frameCount = 0;
  let speed = 0;
  let gravity = 0;
  let spawnTimer = 0;
  let lastDiff = null;

  const JUMP_FORCE = -12.5;
  const DOUBLE_JUMP_FORCE = -11.5;
  const SCORE_RATE = 0.35;

  try {
    const saved = localStorage.getItem('darkRunnerBestTheme');
    if (saved) bestScore = parseInt(saved, 10) || 0;
  } catch(e) {}
  bestSpan.textContent = bestScore;

  const C = {
    playerBody:'#5a7fa0', playerCore:'#8fb8d8', playerEye:'#0a0c12', playerPupil:'#c0d8f0',
    obBody:'#6a2a3a', obInner:'#a84058', obEdge:'#d06078',
    pJump:'#5a8aa8', pLand:'#4a7898', pDeath:'#a84058', hud:'#6a7a90'
  };

  function roundRect(x, y, w, h, r) {
    if (w < 2*r) r = w/2;
    if (h < 2*r) r = h/2;
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  // ============================================================
  //  START / END
  // ============================================================
  function startGame() {
    player.y = GROUND_Y - PLAYER_SIZE;
    player.vy = 0;
    player.grounded = true;
    player.jumpsUsed = 0;

    obstacles = [];
    particles = [];
    score = 0;
    frameCount = 0;
    spawnTimer = 70;
    lastDiff = difficulty(0);
    speed = lastDiff.speed;
    gravity = lastDiff.gravity;

    gameState = 'playing';
    scoreSpan.textContent = '0';
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
  }

  function endGame() {
    gameState = 'over';
    if (score > bestScore) {
      bestScore = score;
      bestSpan.textContent = Math.floor(bestScore);
      try { localStorage.setItem('darkRunnerBestTheme', Math.floor(bestScore).toString()); } catch(e) {}
    }
    const themeName = THEMES[Math.min(3, Math.floor(rampT(score) * 3))].name;
    gameOverSub.innerHTML = `Score: ${Math.floor(score)} &nbsp;·&nbsp; Best: ${Math.floor(bestScore)}<br><span style="font-size:0.8em;color:#4a5468;">World: ${themeName} &nbsp;·&nbsp; Difficulty: ${Math.floor(rampT(score) * 100)}%</span>`;
    gameOverOverlay.classList.remove('hidden');
    spawnDeathParticles(PLAYER_X + PLAYER_SIZE/2, player.y + PLAYER_SIZE/2);
  }

  // ============================================================
  //  PARTICLES
  // ============================================================
  function spawnJumpParticles(cx, cy) {
    for (let i=0;i<10;i++) particles.push({
      x: cx+(Math.random()-0.5)*26, y: cy+(Math.random()-0.5)*16,
      vx:(Math.random()-0.5)*6, vy:(Math.random()-0.8)*5-1,
      life:1.0, size:Math.random()*4+2, color:C.pJump
    });
  }
  function spawnLandingParticles(cx, cy) {
    for (let i=0;i<8;i++) particles.push({
      x: cx+(Math.random()-0.5)*32, y: cy-4+Math.random()*10,
      vx:(Math.random()-0.5)*4, vy:Math.random()*-2.5-0.5,
      life:0.9, size:Math.random()*3+1, color:C.pLand
    });
  }
  function spawnDeathParticles(cx, cy) {
    for (let i=0;i<32;i++) particles.push({
      x: cx, y: cy,
      vx:(Math.random()-0.5)*13, vy:(Math.random()-0.5)*11-2,
      life:1.2, size:Math.random()*6+2,
      color: i%3===0 ? C.pDeath : (i%3===1 ? '#8a5060' : '#5a3a48')
    });
  }

  // ============================================================
  //  JUMP
  // ============================================================
  function attemptJump() {
    if (gameState !== 'playing') return;
    if (player.grounded) {
      player.vy = JUMP_FORCE;
      player.grounded = false;
      player.jumpsUsed = 1;
      spawnJumpParticles(PLAYER_X + PLAYER_SIZE/2, player.y + PLAYER_SIZE/2);
      return;
    }
    if (player.jumpsUsed < player.maxJumps) {
      player.vy = DOUBLE_JUMP_FORCE;
      player.jumpsUsed++;
      for (let i=0;i<10;i++) particles.push({
        x: PLAYER_X + PLAYER_SIZE/2, y: player.y + PLAYER_SIZE/2,
        vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8-1.5,
        life:1.0, size:Math.random()*4+2, color:C.pJump
      });
    }
  }

  // ============================================================
  //  OBSTACLES
  // ============================================================
  function spawnObstacle(diff) {
    const width  = Math.floor(Math.random()*(diff.obMaxW - diff.obMinW + 1) + diff.obMinW);
    const height = Math.floor(Math.random()*(diff.obMaxH - diff.obMinH + 1) + diff.obMinH);
    obstacles.push({ x: W, y: GROUND_Y - height, w: width, h: height });
  }

  function checkCollisions() {
    const px = PLAYER_X, py = player.y, pw = player.width, ph = player.height;
    for (let ob of obstacles) {
      if (px < ob.x + ob.w && px + pw > ob.x && py < ob.y + ob.h && py + ph > ob.y) return true;
    }
    return false;
  }

  // ============================================================
  //  UPDATE
  // ============================================================
  function update(dt) {
    if (gameState === 'over') { updateParticles(dt); return; }
    if (gameState !== 'playing') return;

    frameCount++;

    const diff = difficulty(score);
    lastDiff = diff;
    speed = diff.speed;
    gravity = diff.gravity;

    player.vy += gravity * dt;
    player.y += player.vy * dt;

    if (player.y >= GROUND_Y - player.height) {
      if (!player.grounded) spawnLandingParticles(PLAYER_X + PLAYER_SIZE/2, GROUND_Y - 4);
      player.y = GROUND_Y - player.height;
      player.vy = 0;
      player.grounded = true;
      player.jumpsUsed = 0;
    } else {
      player.grounded = false;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed * dt;
      if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle(diff);
      spawnTimer = Math.floor(Math.random()*(diff.maxSpawn - diff.minSpawn) + diff.minSpawn);
    }

    updateParticles(dt);

    if (checkCollisions()) { endGame(); return; }

    score += SCORE_RATE * dt;
    scoreSpan.textContent = Math.floor(score);
    if (score > bestScore) {
      bestScore = score;
      bestSpan.textContent = Math.floor(bestScore);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.18 * dt;
      p.life -= 0.018 * dt;
      if (p.life <= 0 || p.y > GROUND_Y + 20 || p.x < -30) particles.splice(i, 1);
    }
  }

  // ============================================================
  //  DRAW — themed background, no grid
  // ============================================================
  function draw() {
    const t = lastDiff ? lastDiff.t : 0;
    const theme = themeBlend(t);

    // ---- sky gradient ----
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, rgb(theme.skyTop));
    skyGrad.addColorStop(1, rgb(theme.skyBottom));
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // ---- horizon glow band ----
    const horizGrad = ctx.createLinearGradient(0, GROUND_Y - 120, 0, GROUND_Y);
    horizGrad.addColorStop(0, rgb(theme.horizon, 0));
    horizGrad.addColorStop(1, rgb(theme.horizon, 0.35));
    ctx.fillStyle = horizGrad;
    ctx.fillRect(0, GROUND_Y - 120, W, 120);

    // ---- soft sun/moon disc ----
    const discX = W * 0.72;
    const discY = GROUND_Y - 90 - t * 40;
    const discR = 60 - t * 10;
    const discGrad = ctx.createRadialGradient(discX, discY, 0, discX, discY, discR);
    discGrad.addColorStop(0, rgb(theme.horizon, 0.55));
    discGrad.addColorStop(1, rgb(theme.horizon, 0));
    ctx.fillStyle = discGrad;
    ctx.beginPath();
    ctx.arc(discX, discY, discR, 0, Math.PI * 2);
    ctx.fill();

    // ---- ground ----
    ctx.strokeStyle = rgb(theme.ground);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
    ctx.strokeStyle = rgb(theme.horizon);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 2); ctx.lineTo(W, GROUND_Y + 2); ctx.stroke();

    // ---- particles ----
    for (let p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- obstacles ----
    for (let ob of obstacles) {
      ctx.fillStyle = C.obBody;
      roundRect(ob.x, ob.y, ob.w, ob.h, 6); ctx.fill();
      ctx.fillStyle = C.obInner;
      roundRect(ob.x+3, ob.y+3, ob.w-6, ob.h-6, 4); ctx.fill();
      ctx.strokeStyle = C.obEdge;
      ctx.lineWidth = 1.2;
      roundRect(ob.x+2, ob.y+2, ob.w-4, ob.h-4, 5); ctx.stroke();
    }

    // ---- player ----
    if (gameState !== 'over' || particles.length < 20) {
      ctx.fillStyle = C.playerBody;
      roundRect(PLAYER_X, player.y, PLAYER_SIZE, PLAYER_SIZE, 10); ctx.fill();
      ctx.fillStyle = C.playerCore;
      roundRect(PLAYER_X+6, player.y+6, PLAYER_SIZE-12, PLAYER_SIZE-12, 6); ctx.fill();
      ctx.fillStyle = C.playerEye;
      ctx.beginPath(); ctx.arc(PLAYER_X+13, player.y+15, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(PLAYER_X+27, player.y+15, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = C.playerPupil;
      ctx.beginPath(); ctx.arc(PLAYER_X+12, player.y+13, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(PLAYER_X+26, player.y+13, 1.6, 0, Math.PI*2); ctx.fill();

      if (player.jumpsUsed === 1 && !player.grounded) {
        ctx.strokeStyle = '#8a7a3a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(PLAYER_X + PLAYER_SIZE/2, player.y + PLAYER_SIZE/2, PLAYER_SIZE/2 + 5, 0, Math.PI*2);
        ctx.stroke();
      }
    }

    // ---- HUD ----
    if (lastDiff) {
      ctx.font = 'bold 12px "Segoe UI", monospace';
      ctx.fillStyle = '#c8d0e0';
      ctx.fillText('SPEED ' + speed.toFixed(1), 20, 32);

      const barX = 20, barY = 44, barW = 140, barH = 8;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      roundRect(barX, barY, barW, barH, 4); ctx.fill();
      const fillW = barW * lastDiff.t;
      const r = Math.floor(lerp(90, 200, lastDiff.t));
      const g = Math.floor(lerp(160, 60, lastDiff.t));
      const b = Math.floor(lerp(200, 80, lastDiff.t));
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      roundRect(barX, barY, fillW, barH, 4); ctx.fill();

      ctx.fillStyle = '#e8eef8';
      ctx.font = 'bold 10px "Segoe UI", monospace';
      const themeName = THEMES[Math.min(3, Math.floor(lastDiff.t * 3))].name;
      ctx.fillText(themeName, barX + barW + 8, barY + 8);
    }
  }

  // ============================================================
  //  LOOP
  // ============================================================
  let lastTime = performance.now();
  function gameLoop(now) {
    let dt = (now - lastTime) / 16.67;
    if (dt > 3) dt = 3;
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ============================================================
  //  INPUT
  // ============================================================
  function handleJump(e) {
    if (e && e.cancelable) e.preventDefault();
    if (gameState === 'menu') startGame();
    else if (gameState === 'playing') attemptJump();
    else if (gameState === 'over') startGame();
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (gameState === 'menu') startGame();
      else if (gameState === 'playing') attemptJump();
      else if (gameState === 'over') startGame();
    }
  });

  canvas.addEventListener('mousedown', handleJump);
  canvas.addEventListener('touchstart', handleJump, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  // ============================================================
  //  INIT
  // ============================================================
  player.y = GROUND_Y - PLAYER_SIZE;
  lastDiff = difficulty(0);
  draw();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
